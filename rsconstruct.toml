# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[processor.taplo]
src_dirs = ["."]

[processor.perlcritic]
src_dirs = ["src"]

# Compile-check: catches undeclared vars, bad imports, real syntax errors —
# things perlcritic (a static style checker) does not see.
[processor.script.perl_compile]
command = "perl"
args = ["-I", "src", "-c"]
src_dirs = ["src"]
src_extensions = [".pl", ".pm"]
batch = false
required_tools = ["perl"]

# POD documentation syntax. Every file carries POD, so this covers the whole
# tree; podchecker exits 2 on a file with no POD at all, so a new .pl/.pm here
# must have a =head1 DESCRIPTION block.
[processor.script.podchecker]
command = "podchecker"
src_dirs = ["src"]
src_extensions = [".pl", ".pm"]
batch = false
required_tools = ["perl"]

# perltidy — formatting. Disabled: it reformats 23/24 files (~1257 lines),
# because it disagrees with the compact style used here (my($x)=1 becomes
# my ($x) = 1). -et=1 -i=1 keeps the tab indentation .editorconfig mandates
# for *.pl/*.pm. Flip enabled=true to adopt it, then run `rsconstruct fix`
# once to reformat the tree in a single commit.
[processor.script.perltidy]
command = "perltidy"
args = ["-et=1", "-i=1", "--assert-tidy", "-se", "-o=/dev/null"]
fix_command = "perltidy"
fix_args = ["-et=1", "-i=1", "-b", "-bext=/"]
src_dirs = ["src"]
src_extensions = [".pl", ".pm"]
batch = false
enabled = false
required_tools = ["perl"]

# ─── dependencies ────────────────────────────────────────────────────────────

# The perl_compile processor runs `perl -c` on every .pl/.pm, which loads each
# module the sources `use`, so CI needs them present or compilation aborts at
# the first missing one. These are the non-core modules used under src/;
# everything else the sources use (Data::Dumper, File::Basename, File::Find,
# File::Spec, Getopt::Long, IPC::Open3) ships with perl itself, and MyUtils,
# MyImdb and MyVideo are repo-local. Debian package names verified with
# `dpkg -S` against the file perl actually loads for each module.
[dependencies]
system = [
    "libconfig-inifiles-perl",
    "libdate-manip-perl",
    "libdbi-perl",
    "liberror-perl",
    "libfile-homedir-perl",
    "libimdb-film-perl",
    "libmp3-info-perl",
    "libmp3-tag-perl",
    "libperl6-slurp-perl",
    "liburi-perl",
    "libvideo-info-perl",
    "libwww-perl",
    "libxml-simple-perl",
    "libyaml-perl",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
